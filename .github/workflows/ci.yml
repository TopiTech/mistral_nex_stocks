name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
  PYTHONKEYRING_BACKEND: keyring.backends.fail.Keyring
  MNS_SKIP_BOOTSTRAP: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npx prettier --check "static/js/**/*.js" "chrome_extension/**/*.js"

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.25"
          enable-cache: true

      - name: Install lint dependencies
        run: uv sync --locked --group lint

      - name: Run ruff
        run: uv run --locked --group lint ruff check . --line-length=100

      - name: Run flake8
        run: uv run --locked --group lint flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pylint (errors only)
        run: uv run --locked --group lint pylint --errors-only --disable=import-error app.py config_utils.py trend_sources.py native_host/native_host.py routes/ services/ utils/

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.25"
          enable-cache: true

      - name: Install type-check dependencies
        run: uv sync --locked --group typecheck

      - name: Run mypy
        run: uv run --locked --group typecheck mypy

      - name: Run pyrefly
        run: uv run --locked --group typecheck pyrefly check .

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.25"
          enable-cache: true

      - name: Install security dependencies
        run: uv sync --locked --group security

      - name: Run Bandit (fail on MEDIUM or HIGH)
        run: uv run --locked --group security bandit --configfile pyproject.toml -r . --severity-level medium -f txt -o bandit_report.txt

      - name: Run pip-audit
        run: uv run --locked --group security pip-audit --strict

      - name: Verify SRI Hashes in HTML
        run: |
          echo "Verifying SRI integrity hashes on all CDN <script> tags..."
          missing=0
          for f in templates/*.html; do
            if perl -0777 -e '
              my $f = shift;
              open my $fh, "<", $f or die $!;
              my $c = do { local $/; <$fh> };
              while ($c =~ /<script\b([^>]*)>/g) {
                my $attrs = $1;
                if ($attrs =~ /src="https:\/\// && $attrs !~ /integrity="sha384-/) {
                  print "MISSING SRI in $f\n";
                  exit 1;
                }
              }
            ' "$f"; then :; else missing=1; fi
          done
          if [ "$missing" -eq 1 ]; then echo "SRI check FAILED: a CDN <script> lacks an integrity hash"; exit 1; fi
          echo "SRI check passed."

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit_report.txt

  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.25"
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --locked --group test --python ${{ matrix.python-version }}

      - name: Run tests with coverage
        run: |
          uv run --locked --group test python -m pytest tests/ -v -s --durations=10 --timeout=60 --timeout-method=thread --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=68

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
