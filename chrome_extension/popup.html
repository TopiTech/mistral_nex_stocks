<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mistral NeX Stocks Launcher</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="ext-header">
      <div class="ext-brand">
        <h1>Mistral NeX Stocks</h1>
        <span id="healthPill" class="pill ng">未起動</span>
      </div>
      <div id="healthMeta" class="meta">状態確認中...</div>
    </header>

    <!-- Tab Navigation -->
    <nav class="tab-bar" role="tablist">
      <button
        type="button"
        class="tab-btn active"
        data-tab="stocks"
        role="tab"
        aria-selected="true"
      >
        📈 リアルタイム株価
      </button>
      <button
        type="button"
        class="tab-btn"
        data-tab="system"
        role="tab"
        aria-selected="false"
      >
        ⚙️ システム管理
      </button>
    </nav>

    <!-- Tab 1: Stocks & Indices -->
    <main id="tab-content-stocks" class="tab-content active" role="tabpanel">
      <div class="card" id="stockPricesCard">
        <div class="status">
          <strong>市場リアルタイム価格</strong>
          <span id="stockRefreshTime" class="refresh-time"></span>
        </div>
        <div class="filter-box">
          <input
            type="search"
            id="extStockFilter"
            placeholder="銘柄名またはティッカーで検索..."
            autocomplete="off"
          />
        </div>
        <div id="stockListContainer" class="stock-list-container">
          <!-- Indices and stocks listed dynamically -->
        </div>
      </div>
    </main>

    <!-- Tab 2: System Control & Launchers -->
    <main id="tab-content-system" class="tab-content hidden" role="tabpanel">
      <div class="card">
        <div class="status">
          <strong>バックエンド制御</strong>
        </div>
        <div class="actions">
          <button id="refreshBtn" class="alt" type="button">再確認</button>
          <button id="startBtn" type="button">バックエンド起動</button>
          <button id="stopBtn" class="danger hidden" type="button">
            バックエンド停止
          </button>
        </div>
      </div>

      <div class="card">
        <div class="status">
          <strong>アプリを開く</strong>
          <span id="browserPill" class="pill ok">Browser</span>
        </div>
        <div class="actions grid-2x2">
          <button id="openMainBtn" type="button">メイン画面</button>
          <button id="openSetupBtn" class="alt" type="button">API設定</button>
          <button id="openSettingsBtn" class="alt" type="button">設定</button>
          <button id="copyDiagBtn" class="warn" type="button">
            診断コピー
          </button>
        </div>
        <details class="mt-8">
          <summary>詳細 / 診断情報</summary>
          <div id="diagBox" class="diag"></div>
        </details>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
