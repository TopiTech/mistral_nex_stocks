[tool.bandit]
exclude_dirs = ["tests", ".mimocode", ".venv", "__pycache__", "scratch", "node_modules"]
skips = [
    "B311",  # random used - not applicable
    "B110",  # try_except_pass - intentional silent fallback / defensive cleanup (mirrors S110)
    "B105",  # hardcoded password heuristic - false positive for uWSGI --cheaper flag
    "B404",  # subprocess module import - used safely in native_host process launcher
    "B603",  # subprocess call without shell=True - used safely with fixed argument arrays
]

[[tool.bandit.per-file-ignores]]
filenames = ["tests/**/*.py"]
skips = ["B101"]  # assert used - common in tests

[tool.pyrefly.errors]
redundant-cast = "warn"

[tool.coverage.run]
# Coverage threshold: 75% line coverage is enforced by CI (see .github/workflows/ci.yml
# `--cov-fail-under=75`). This threshold was raised from the original 68% baseline as
# the suite grew to 2100+ tests; keep it in sync with the CI flag. The synchronous
# executor test pattern (SynchronousExecutor in conftest.py) means concurrency and
# executor-queue scenarios are not reflected in this metric.
omit = [
    "tests/*",
    ".mimocode/*",
    "split_js.py",
    "native_host/install_host_windows.ps1",
    "native_host/uninstall_host_windows.ps1",
    "native_host/diagnose_native_host_windows.ps1",
    "native_host/native_host.cmd",
    "native_host/host_launcher.cmd.template",
    "native_host/com.mistral_nex_stocks.host.json",
]

[project]
name = "mistral-nex-stocks"
version = "3.0.0"
description = "AI-Powered Real-time Stock Dashboard with Mistral LLM"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
keywords = ["stocks", "finance", "AI", "mistral", "flask", "dashboard"]
dependencies = [
    "Flask>=3.1.3,<3.2",
    "pandas>=2.2,<4.0",
    "pydantic>=2.0,<3.0",
    "requests>=2.33.0",
    "tenacity>=9.0,<10",
    "mistralai>=2.4.7,<3.0",
    "yfinance>=0.2.40,<2.0",
    "curl_cffi>=0.15,<1.0",
    "ddgs>=9.9,<11.0",
    "cachetools>=5.4,<8",
    "feedparser>=6.0.1,<7",
    "pytrends-modern>=0.2.5,<0.3",
    "psutil>=5.9.8,<8",
    "keyring>=25.0,<27",
    "flask-wtf>=1.2.1,<2.0",
    "flask-talisman>=1.1.0,<2.0",
    "python-json-logger>=2.0.2,<5.0",
    "websocket-client>=1.9.0,<2.0",
    "cryptography>=48.0.1,<51.0.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "tavily-python>=0.7.26,<1.0",
    "beautifulsoup4>=4.12.0,<5.0",
    "gunicorn>=26.0.0,<27.0; sys_platform != 'win32'",
    "h2>=4.4.1,<5.0",
]

[dependency-groups]
lint = [
    "flake8==7.3.0",
    "pylint==4.0.7",
    "ruff==0.16.3",
]
typecheck = [
    "mypy==2.3.0",
    "pyrefly==1.2.0",
    "types-cachetools==7.0.0.20260713",
    "types-psutil==7.2.2.20260518",
    "types-python-dateutil==2.9.0.20250822",
    "types-requests==2.32.4.20260107",
]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
]
security = [
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "BLE001",  # Do not catch blind exception: Exception (defensive fallbacks across third-party calls)
    "S110",    # try-except-pass (intentional silent fallback / cleanup)
    "LOG014",  # exc_info in catch-all error handler is intentional (app-level handler)
]

[tool.ruff.lint.per-file-ignores]
# E402: Module level import not at top of file — intentional for circular import avoidance
"app.py" = ["E402"]
"routes/api_stocks.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"tests/*" = ["SIM117"]  # Allow nested with statements in test mock contexts

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_equality = true
warn_unused_configs = true
exclude = [
    "^tests/",
]
disable_error_code = [
    "no-any-return",
    "unused-ignore",
]
files = [
    "app.py",
    "app_bg.py",
    "bg",
    "config_store.py",
    "config_utils.py",
    "constants.py",
    "credential_manager.py",
    "crypto_utils.py",
    "error_codes.py",
    "error_handlers.py",
    "execution_state.py",
    "ai_state.py",
    "app_state.py",
    "market_state.py",
    "wsgi.py",
    "gunicorn.conf.py",
    "mistral_compat.py",
    "route_helpers.py",
    "routes",
    "schemas",
    "services",
    "trend_sources.py",
    "utils",
    "native_host",
]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pyrefly]
project-includes = [
    "app.py",
    "app_bg.py",
    "bg",
    "config_store.py",
    "config_utils.py",
    "constants.py",
    "credential_manager.py",
    "crypto_utils.py",
    "error_codes.py",
    "error_handlers.py",
    "execution_state.py",
    "ai_state.py",
    "app_state.py",
    "market_state.py",
    "wsgi.py",
    "gunicorn.conf.py",
    "mistral_compat.py",
    "route_helpers.py",
    "routes",
    "schemas",
    "services",
    "trend_sources.py",
    "utils",
    "native_host",
]
python-version = "3.11"
preset = "default"
ignore-missing-imports = ["*"]
